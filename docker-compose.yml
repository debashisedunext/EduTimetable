name: edutimetable

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-edutimetable_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edutimetable}
    volumes:
      - mysql-data:/var/lib/mysql
      # creates the control-plane schema on first start (§17.3)
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-edutimetable_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: edutimetable/api:prod
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-edutimetable_dev}@mysql:3306/${MYSQL_DATABASE:-edutimetable}
      # §17.3: the tenant registry. A separate schema on the same server, because
      # a dedicated tenant's connection details cannot live inside a tenant DB.
      CONTROL_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-edutimetable_dev}@mysql:3306/${CONTROL_DATABASE:-edutimetable_control}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_prod}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:5174}
      ERP_PUBLIC_KEY: ${ERP_PUBLIC_KEY:-}
    ports:
      # Host 3001/5174 (3000/5173 are commonly taken on dev machines); inside
      # the Docker network the api is always api:3000.
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: edutimetable/api:prod
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-edutimetable_dev}@mysql:3306/${MYSQL_DATABASE:-edutimetable}
      # §17.3: the tenant registry. A separate schema on the same server, because
      # a dedicated tenant's connection details cannot live inside a tenant DB.
      CONTROL_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-edutimetable_dev}@mysql:3306/${CONTROL_DATABASE:-edutimetable_control}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPTIMIZER_URL: ${OPTIMIZER_URL:-http://optimizer:8000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # §5.6 soft-optimization engine. Optional at runtime: if it is down, the
  # worker falls back to the fast TypeScript CSP engine and generation still
  # succeeds — "Optimized" mode is an upgrade, never a dependency.
  optimizer:
    image: edutimetable/optimizer:prod
    build:
      context: .
      dockerfile: docker/optimizer.Dockerfile
      target: prod
    environment:
      PORT: 8000
      CPSAT_WORKERS: ${CPSAT_WORKERS:-8}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: edutimetable/web:prod
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: prod
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  mysql-data:
  redis-data:
